<script type="text/javascript">
	window.addEventListener('addCookies', function(event){
        let {cookieName, cookieValue, expireInDays, domain} = event.detail;
        let expires = "";
        if (expireInDays) {
            let date = new Date();
            date.setTime(date.getTime() + (expireInDays * 24 * 60 * 60 * 1000));
            expires = "; expires=" + date.toUTCString();
        }
        let domainAttribute = domain ? "; domain=" + domain : "";
        console.log('addCookies Fired');
        document.cookie = cookieName + "=" + (cookieValue || "") + expires + domainAttribute + "; path=/;secure;";
    });  
</script>
