<template lwc:render-mode="light">
    <div class="filter-accordeon">
        <section id="filter-accordeon">
            <ul>
                <li class="first-category-filter">
                    <input tabindex="0" type="checkbox" id="check-1" />
                    <i></i>
                    <label for="check-1">Category</label>
                    <article class="panel">
                        <div class="box">
                            <ul class="first">
                                <li>
                                    <c-sib-search-category-tree display-data={categories}></c-sib-search-category-tree>
                                </li>
                            </ul>
                        </div>
                    </article>
                </li>
                <template for:each={facets} for:item="facet">
                    <c-sib-search-facet key={facet.nameOrId} display-data={facet} data-facetid={facet.nameOrId}
                        onfacetvaluetoggle={handleFacetValueToggle}>
                    </c-sib-search-facet>
                </template>
            </ul>
        </section>
    </div>
</template>
