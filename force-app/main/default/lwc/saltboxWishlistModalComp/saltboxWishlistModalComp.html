<template>
    
  
<template if:true={wishListData}>
    <section role="dialog"  tabindex="-1" class="slds-modal wishlist-modal slds-fade-in-open slds-modal_small" aria-labelledby="modal-heading-01" aria-modal="true">
        <div class="slds-modal__container">
          <div class="slds-modal__header">
            <div class="slds-grid">
                <div class="slds-col">
                    <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate slds-float--left">{wishlistProperties.Modal_Title__c}</h1>
                </div>
                <div class="slds-col">
                    <lightning-icon onclick={handleCancel} style="cursor: pointer;" class="slds-float--right" icon-name="utility:close" size="small"></lightning-icon>
                </div>
            </div>
           
          </div>
          <div class="slds-modal__content modal-body slds-p-around_medium"  id="modal-content-id-1">
            <template if:true={wishListData}>
              <table class="slds-table slds-table_cell-buffer slds-table_bordered" data-id="wishlist-list" style = "border-top : 0px; border-bottom : 0px;" aria-labelledby="element-with-table-label other-element-with-table-label">
                <thead>
                  <tr class="slds-line-height_reset">
                    <th class="" scope="col">

                    </th>
                    <th class="slds-wrap" scope="col">
                      {wishlistProperties.Wishlist_Column_Name_Text__c}
                    </th>
                    <th class="slds-wrap" scope="col">
                      Created On
                    </th>
                    <th class="slds-wrap" scope="col">
                      No. Of Products
                    </th>
                    <th class="" scope="col">

                    </th>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={wishListData} for:item = "item">
                    <tr key = {item.wishList.wishlistId} aria-selected="false" class="slds-hint-parent">
                      <td key = {item.wishList.wishlistId} class=" slds-cell_action-mode" role="gridcell">
                        <div class="slds-checkbox">
                          <input type="checkbox" onchange={handleCheckBoxClick} style = "width : 24px ; height : 15px; position: unset;" name="options" data-id={item.wishList.wishlistId}  value={item.wishList.wishlistId} tabindex="0" aria-labelledby="check-button-label-01 column-group-header" />
                        </div>
                      </td>
                      <td key = {item.wishList.wishlistId} class="slds-cell_action-mode" role="gridcell">
                        {item.wishList.name}
                      </td>
                      <td key = {item.wishList.wishlistId} class="slds-cell_action-mode" role="gridcell">
                        <lightning-formatted-date-time value= {item.wishList.createdDate} year="numeric"
                        month="numeric"
                        day="numeric" ></lightning-formatted-date-time> 
                      </td>
                      <td key = {item.wishList.wishlistId} class="slds-cell_action-mode" role="gridcell">
                        {item.wishList.wishlistProductCount}
                      </td>
                      <td key = {item.wishList.wishlistId} class="slds-cell_action-mode" role="gridcell">
                        
                      </td>
                    </tr>
                    
                  </template>
                  <template if:true={showNewBucketSection}>
                    <tr  aria-selected="false" data-id="wishlist-input" class="slds-hint-parent">
                      <td  class=" slds-cell_action-mode" role="gridcell">
  
                      </td>
                      <td  class=" slds-cell_action-mode" role="gridcell">
                        <input type="text" id="text-input-id-47"  onblur={handleChange} placeholder="Placeholder text…" required="" class="slds-input" />
                      </td>
                      <td  class=" slds-cell_action-mode" role="gridcell">
  
                      </td>
                      <td  class=" slds-cell_action-mode" role="gridcell">
                        
                      </td>
                      <td  class=" slds-cell_action-mode" role="gridcell">
                        <div class="slds-grid" >
                          <div class="slds-col slds-p-horizontal--small">
                            <lightning-icon onclick = {saveBucket} size="small" icon-name="utility:check" ></lightning-icon>
                          </div>
                          <div class="slds-col">
                              <lightning-icon onclick={createBucket}   size="small" icon-name="utility:close" ></lightning-icon>
                              <!--<svg focusable="false" onclick={handleEditBucketName} stroke="#2A8F56" if:true={editBucketName} data-key="close" aria-hidden="true" viewBox="0 0 52 52" class="slds-icon slds-icon_small"><g><path d="M31 25.4l13-13.1c.6-.6.6-1.5 0-2.1l-2-2.1c-.6-.6-1.5-.6-2.1 0L26.8 21.2c-.4.4-1 .4-1.4 0L12.3 8c-.6-.6-1.5-.6-2.1 0l-2.1 2.1c-.6.6-.6 1.5 0 2.1l13.1 13.1c.4.4.4 1 0 1.4L8 39.9c-.6.6-.6 1.5 0 2.1l2.1 2.1c.6.6 1.5.6 2.1 0L25.3 31c.4-.4 1-.4 1.4 0l13.1 13.1c.6.6 1.5.6 2.1 0L44 42c.6-.6.6-1.5 0-2.1L31 26.8c-.4-.4-.4-1 0-1.4z"></path></g></svg>-->
                          </div>
                       </div>
                       
                      </td>
                    </tr>
                  </template>
                  
                </tbody>
              </table>
            </template>
           
            
          </div>
          <div class="slds-modal__footer">
            <div class="slds-grid">
                <div class="slds-col">
                    <button  class="slds-button slds-float--left create-bucket slds-align--absolute-center" disabled = {showNewBucketSection} onclick = {createBucket}>
                        <svg class="slds-m-right--x-small slds-m-left--small" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M10 0C4.5 0 0 4.5 0 10C0 15.5 4.5 20 10 20C15.5 20 
                            20 15.5 20 10C20 4.5 15.5 0 10 0ZM15 11.25H11.25V15H8.75V11.25H5V8.75H8.75V5H11.25V8.75H15V11.25Z" fill="white"></path>
                         </svg>
                         {wishlistProperties.Add_button_text__c}
                    </button>
                </div>
                <div class="slds-col">
                    <button class="slds-button slds-button_neutral cancel" onclick = {handleCancel} aria-label="Cancel and close">Cancel</button>
                    <template if:false={addEnable}>
                       <button disabled class="slds-button slds-button_brand addDisable">Add</button>
                    </template>
                    <template if:true={addEnable}>
                      <button  class="slds-button slds-button_brand addEnable" onclick={handleAddWishlist}>Add</button>
                   </template>

                </div>
            </div>
          </div>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
 </template>
 <!--Spinner -->
 <template if:true={isLoading}>
    <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
 </template>
</template>
