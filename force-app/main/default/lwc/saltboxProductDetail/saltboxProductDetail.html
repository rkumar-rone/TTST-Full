<template>
    <lightning-spinner if:false={hasProduct} class="slds-is-relative slds-align_absolute-center slds-m-around_large"
        alternative-text="Loading product information..." size="medium" variant="brand">
    </lightning-spinner>
    <c-saltbox-product-details-display if:true={hasProduct} cart-locked={_isCartLocked}
        category-path={displayableProduct.categoryPath} custom-fields={displayableProduct.customFields}
        description={displayableProduct.description} image={displayableProduct.image}
        in-stock={displayableProduct.inStock} name={displayableProduct.name} price={displayableProduct.price}
        sku={displayableProduct.sku} event-sessions={displayableProduct.sessions} training-location={displayableProduct.trainingLocation}
        delivery-format={displayableProduct.deliveryFormat} onaddtocart={addToCart} oncreateandaddtolist={createAndAddToList}
        ongbpaddtocart={gbpAddToCartFn}
        variations={variations}
        record-id={recordId}
        effective-account-id={effectiveAccountId}
        >
    </c-saltbox-product-details-display>
    <c-saltbox-spinner show-spinner={showLoading}></c-saltbox-spinner>

</template>
