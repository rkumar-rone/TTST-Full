<template lwc:render-mode="light">
    <div class="bread-crumbs" lwc:if={showDetails}>
        <div class="container">
            <template lwc:if={categoryPath} for:each={categoryPath} for:item="cat">
                <a key={cat.id} href={cat.url} target="_self">{cat.name}</a> 
                <span key={cat.id} if:false={cat.isLast}> / </span>
            </template>
        </div>
    </div>
</template>
