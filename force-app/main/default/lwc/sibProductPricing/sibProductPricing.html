<template lwc:render-mode="light">
    <div if:true={isPriceAvailable} class={layoutClass}>
        <template if:true={displayNegotiatedPrice}>
            <!--<span if:true={hasNegotiatedPriceLabel} class="price">
                {negotiatedPriceLabel}:
            </span>-->
            <span class="price">
                <lightning-formatted-number 
                    class="negotiated-price price-label" 
                    value={negotiatedPrice} 
                    maximum-fraction-digits="20" 
                    currency-code={currencyCode} 
                    format-style="currency"
                ></lightning-formatted-number>
            </span>
        </template>
        <template if:true={displayOriginalPrice}>
            <!--<span if:true={hasOriginalPriceLabel} class="price-col-section slds-text-heading_small slds-p-right_x-small">
                {originalPriceLabel}:
            </span>-->
            <span class="price">
                <span if:true={displayAssistiveText} class="slds-assistive-text">
                    {strikethroughAssistiveText}
                </span>
                <lightning-formatted-number 
                    class="original-price price-label" 
                    value={originalPrice} 
                    maximum-fraction-digits="20" 
                    currency-code={currencyCode} 
                    format-style="currency"
                ></lightning-formatted-number>
            </span>
        </template>
    </div>
    <div class="tax-container" if:true={taxInfoVisible}> 
        <p class="tax-info-label">{taxIncludedLabel}</p>
    </div>
    <div if:false={isPriceAvailable} class="price-unavailable">
        {unavailablePriceLabel}
    </div>
</template>
