<template>
    <article if:true={config} class="slds-card slds-p-around_medium noShadow">
        <div class="slds-card__body slds-card__body_inner">
            <lightning-accordion allow-multiple-sections-open>
                <!-- Iterate through categories -->
                <template for:each={config} for:item="section" for:index="sectionIndex">
                    <lightning-accordion-section class="accordianHeader" name={section.value} label={section.value}
                        key={section.value}>

                        <!-- Main section details -->
                        <article class="slds-card">
                            <div class="slds-card__body slds-card__body_inner">
                                <fieldset class="slds-form-element slds-form-element_compound slds-p-bottom_large">
                                    <table
                                        class="slds-table slds-table_cell-buffer slds-no-row-hover slds-table_bordered">
                                        <thead class="configTableHeader">
                                            <tr class="slds-line-height_reset">
                                                <th scope="col">
                                                    <div class="slds-truncate" title="Name">{label.menuConfigCustomLabel}</div>
                                                </th>
                                                <th scope="col">
                                                    <div class="slds-truncate" title="Label">{label.URL}</div>
                                                </th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr class="configTableBodyRow">
                                                <td>
                                                    <h2>{section.type}</h2>
                                                </td>
                                                <td>
                                                    <lightning-input data-name="URL" type="text" value={section.URL}
                                                        class="configTableInput" onchange={handleInputChange}
                                                        data-id={sectionIndex}></lightning-input>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </fieldset>
                                <!-- Iterate through subcategories of the section -->
                                <template if:true={section.subCategories}>
                                    <lightning-accordion allow-multiple-sections-open>
                                        <template for:each={section.subCategories} for:item="subsection"
                                            for:index="subsectionIndex">
                                            <lightning-accordion-section class="accordianHeader"
                                                name={subsection.SubCategoryName} label={subsection.SubCategoryName}
                                                key={subsection.SubCategoryName}>
                                                <article class="slds-card" >
                                                    <div class="slds-card__body slds-card__body_inner">
                                                        <fieldset
                                                            class="slds-form-element slds-form-element_compound slds-p-bottom_large">
                                                            <table
                                                                class="slds-table slds-table_cell-buffer slds-no-row-hover slds-table_bordered">
                                                                <thead class="configTableHeader">
                                                                    <tr class="slds-line-height_reset">
                                                                        <th scope="col">
                                                                            <div class="slds-truncate" title="Name">
                                                                                {label.menuConfigCustomLabel}</div>
                                                                        </th>
                                                                        <th scope="col">
                                                                            <div class="slds-truncate" title="Label">{label.URL}
                                                                            </div>
                                                                        </th>
                                                                    </tr>
                                                                </thead>
                                                                <tbody>
                                                                    <template for:each={subsection.records}
                                                                        for:item="eachRecords"
                                                                        for:index="eachRecordsIndex">
                                                                        <tr class="configTableBodyRow"
                                                                            key={eachRecords.Label}>
                                                                            <td>
                                                                                <h2>{eachRecords.Label}</h2>
                                                                            </td>
                                                                            <td>
                                                                                <lightning-input data-name="URL"
                                                                                    type="text" value={eachRecords.URL}
                                                                                    class="configTableInput"
                                                                                    onchange={handleSubCategoryInputChange}
                                                                                    data-parent-id={sectionIndex}
                                                                                    data-id={subsectionIndex}
                                                                                    data-record-id={eachRecordsIndex}></lightning-input>
                                                                            </td>
                                                                        </tr>
                                                                    </template>
                                                                </tbody>
                                                            </table>
                                                        </fieldset>
                                                    </div>
                                                </article>
                                            </lightning-accordion-section>
                                        </template>
                                    </lightning-accordion>
                                </template>
                            </div>
                        </article>
                    </lightning-accordion-section>
                </template>
            </lightning-accordion>
        </div>
        <div class="button-container slds-m-top_medium slds-p-horizontal_medium slds-text-align_center">
            <lightning-button label="Save" variant="brand" class="slds-p-horizontal_small"
                onclick={handleSave}></lightning-button>
            <lightning-button label="Cancel" variant="neutral" onclick={handleCancel}></lightning-button>
        </div>
    </article>
</template>
