<template>
    <template if:true={isLoading}>
        <lightning-spinner alternative-text="Loading..." variant="brand"></lightning-spinner>
    </template>
    <lightning-card variant="base">
        <div slot="title">
            Payment and Billing
        </div>
        <div class="slds-grid slds-grid_align-center slds-p-around_x-small">
            <div class="slds-col slds-size_5-of-6 slds-grid slds-grid_vertical">

                <div class="slds-col slds-box slds-m-around_x-small">
                    <lightning-radio-group name="billingOptions" label="Billing Addresses" options={billingOptions} value={billingSelectedOption} type="radio" onchange={handleBillingChange}></lightning-radio-group>
                    <template if:true={showNewBillingAddressForm}>
                        <div class="slds-p-horizontal_large slds-p-vertical_medium">
                            <lightning-input-address
                            street-label="Street"
                            address-label="Address Information"
                            city-label="City"
                            country-label="Country"
                            province-label="State"
                            postal-code-label="Zip Code"
                            country={outputSelectedCountry}
                            province={outputSelectedState}
                            country-options={countries}
                            province-options={states}
                            onchange={handleAddressChange}  
                            >
                        </lightning-input-address> 
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </lightning-card>
    <div class="slds-card__footer" style="margin: var(--lwc-spacingNone);padding-top: var(--lwc-spacingSmall);border-top: 1px solid var(--lwc-colorBorder);width: 100%;">
            <lightning-button variant="brand" label="Next" onclick={goNext}></lightning-button>
    </div>
</template>
