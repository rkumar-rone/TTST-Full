<template>
    <!--Error Toast Msg Start-->
    <c-sib-show-toast-message></c-sib-show-toast-message>
    <!--Error Toast Msg End-->
    <div data-id="signing-in-progress">
        <section class="account-page">
            <div class="wrapper-account">
              <h2 class="title">Login</h2>
              <div class="content">
                  <div class="form-group">
                    <label for="email">Email*</label>
                    <input type="email" class="form-control" id="email" placeholder="" onchange={handleEmailChange}>
                  </div>
                  <div class="form-group">
                    <label for="password">Password*</label>
                    <input type="password" class="form-control" id="password" placeholder="" onchange={handlePasswordChange}>
                  </div>
                  <button class="btn" onclick={handleLogin}>Sign In</button>
                  <a href="/ForgotPassword" class="link-form">Forgot Password?</a>
              </div>
            </div>
          </section>
    </div>
</template>
