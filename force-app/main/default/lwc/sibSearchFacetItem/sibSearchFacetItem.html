<template lwc:render-mode="light">
    <lightning-input label={value.displayName} variant="label-hidden" type={type} checked={value.checked}
        onclick={handleFacetValueToggle} onkeyup={handleKeyPress} data-id={value.nameOrId} data-checked={value.checked}
        data-displayname={value.displayName} data-facetid={facetName} data-facettype={facetType} class="slds-m-top_xx-small slds-m-bottom_none plpFilter"></lightning-input>
    <!-- Note: Adding the label outside since the lightning-input label is
        not truncating based on it's container. The screen reader still picks
        the internal label for accessibility, so we are adding a span with title
        for every other scenarios. -->
        <label>{value.displayName} ({value.productCount})</label>
</template>
