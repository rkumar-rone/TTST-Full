<template>
    <template if:true={config}>
        <article class="slds-card slds-p-around_medium noShadow">
            <div class="slds-card__body slds-card__body_inner"><!--slds-card__body_scrollable-->
                <lightning-accordion allow-multiple-sections-open active-section-name={activeSections}>
                    <lightning-accordion-section class="accordianHeader" name="individualConfigs" label="Individual Configs">
                        <article class="slds-card">
                            <div class="slds-card__body slds-card__body_inner">
                                <div class="slds-form slds-form_compound slds-p-top_large slds-p-bottom_large" >
                                    <div class="slds-form-element slds-form-element_horizontal">
                                        <label class="slds-form-element__label configLabel">View Options Button Text</label>
                                        <div class="slds-form-element__control">
                                            <lightning-input type="text" class="configInput" data-id="viewOptionsButtonText" value={viewOptionsButtonText} onchange={handleChange}></lightning-input>
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal">
                                        <label class="slds-form-element__label configLabel">Add To Cart Button Text</label>
                                        <div class="slds-form-element__control">
                                            <lightning-input type="text" class="configInput" data-type="text" data-id="addToCartButtonText" value={addToCartButtonText} onchange={handleChange}></lightning-input>
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal">
                                        <label class="slds-form-element__label configLabel">Add To Cart Button Style</label>
                                        <div class="slds-form-element__control">
                                            <lightning-input type="text" class="configInput" data-type="text" data-id="addToCartButtonStyle" value={addToCartButtonStyle} onchange={handleChange}></lightning-input>
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal">
                                        <label class="slds-form-element__label configLabel">Add To Cart Button Processing Text</label>
                                        <div class="slds-form-element__control">
                                            <lightning-input type="text" class="configInput" data-type="text" data-id="addToCartButtonProcessingText" value={addToCartButtonProcessingText} onchange={handleChange}></lightning-input>
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal">
                                        <label class="slds-form-element__label configLabel">Price Unavailable Text</label>
                                        <div class="slds-form-element__control">
                                            <lightning-input type="text" class="configInput" data-type="text" data-id="unavailablePriceText" value={unavailablePriceText} onchange={handleChange}></lightning-input>
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal">
                                        <label class="slds-form-element__label configLabel">Grid Max Columns Displayed</label>
                                        <div class="slds-form-element__control">
                                            <lightning-input type="number" class="configInput" data-type="number" min="3" data-id="gridMaxColumnsDisplayed" value={gridMaxColumnsDisplayed} onchange={handleChange}></lightning-input>
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal">
                                        <label class="slds-form-element__label configLabel">Search Results Page Size</label>
                                        <div class="slds-form-element__control">
                                            <lightning-input type="number" class="configInput" data-type="number" min="1" data-id="searchResultsPageSize" value={searchResultsPageSize} onchange={handleChange}></lightning-input>
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal">
                                        <label class="slds-form-element__label configLabel">Self Study Page Size</label>
                                        <div class="slds-form-element__control">
                                            <lightning-input type="number" class="configInput" data-type="number" min="1" data-id="selfStudyPageSize" value={selfStudyPageSize} onchange={handleChange}></lightning-input>
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal">
                                        <label class="slds-form-element__label configLabel">Show Product Image</label>
                                        <div class="slds-form-element__control">
                                            <label class="slds-checkbox_toggle slds-grid">
                                                <input type="checkbox" class="configInput" data-id="showProductImage" name="showProductImage" checked={showProductImage} aria-describedby="showProductImage" onchange={handleCheckboxChange}/>
                                                <span id="showProductImage" class="slds-checkbox_faux_container">
                                                <span class="slds-checkbox_faux"></span>
                                                <span class="slds-checkbox_on">Enabled</span>
                                                <span class="slds-checkbox_off">Disabled</span>
                                                </span>
                                            </label>
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal">
                                        <label class="slds-form-element__label configLabel">Show Original Price</label>
                                        <div class="slds-form-element__control">
                                            <label class="slds-checkbox_toggle slds-grid">
                                                <input type="checkbox" class="configInput" data-id="showOriginalPrice" name="showOriginalPrice" checked={showOriginalPrice} aria-describedby="showOriginalPrice" onchange={handleCheckboxChange}/>
                                                <span id="showOriginalPrice" class="slds-checkbox_faux_container">
                                                <span class="slds-checkbox_faux"></span>
                                                <span class="slds-checkbox_on">Enabled</span>
                                                <span class="slds-checkbox_off">Disabled</span>
                                                </span>
                                            </label>
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal">
                                        <label class="slds-form-element__label configLabel">Show Negotiated Price</label>
                                        <div class="slds-form-element__control">
                                            <label class="slds-checkbox_toggle slds-grid">
                                                <input type="checkbox" class="configInput" data-id="showNegotiatedPrice" name="showNegotiatedPrice" checked={showNegotiatedPrice} aria-describedby="showNegotiatedPrice" onchange={handleCheckboxChange}/>
                                                <span id="showNegotiatedPrice" class="slds-checkbox_faux_container">
                                                <span class="slds-checkbox_faux"></span>
                                                <span class="slds-checkbox_on">Enabled</span>
                                                <span class="slds-checkbox_off">Disabled</span>
                                                </span>
                                            </label>
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal">
                                        <label class="slds-form-element__label configLabel">Show Layout Buttons</label>
                                        <div class="slds-form-element__control">
                                            <label class="slds-checkbox_toggle slds-grid">
                                                <input type="checkbox" class="configInput" data-id="showLayoutButtons" name="showLayoutButtons" checked={showLayoutButtons} aria-describedby="showLayoutButtons" onchange={handleCheckboxChange}/>
                                                <span id="showLayoutButtons" class="slds-checkbox_faux_container">
                                                <span class="slds-checkbox_faux"></span>
                                                <span class="slds-checkbox_on">Enabled</span>
                                                <span class="slds-checkbox_off">Disabled</span>
                                                </span>
                                            </label>
                                        </div>
                                    </div>
                                    <template if:true={showLayoutButtons}>
                                        <div class="slds-form-element slds-form-element_horizontal">
                                            <label class="slds-form-element__label configLabel">Available Layouts</label>
                                            <div class="slds-form-element__control">
                                                <div class="slds-grid slds-wrap">
                                                    <template for:each={layoutOptions} for:item="option">
                                                        <div key={option.key} class="slds-checkbox">
                                                            <input type="checkbox" id ={option.value} data-id ="availableLayouts" name="availableLayouts" value={option.value} checked={option.checked} onclick={handleLayoutOptionsChange}/>
                                                            <label class="slds-checkbox__label" for={option.value}>
                                                            <span class="slds-checkbox_faux"></span>
                                                            <span class="slds-form-element__label checkboxLabel">{option.label}</span>
                                                            </label>
                                                        </div>
                                                    </template>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                    <div class="slds-form-element slds-form-element_horizontal">
                                        <label class="slds-form-element__label configLabel">Default View</label>
                                        <div class="slds-form-element__control">
                                            <template for:each={defaultViewOptions} for:item="option">
                                                <label key={option.value} class="slds-radio">
                                                    <input type="radio" id ={option.value} data-id ="defaultView" name="defaultView" value={option.value} checked={option.checked} onclick={handleDefaultViewChange} />
                                                    <span class="slds-radio_faux"></span>
                                                    <span class="slds-form-element__label radioLabel">{option.label}</span>
                                                </label>
                                            </template>
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal">
                                        <label class="slds-form-element__label configLabel">Show Call To Action Button</label>
                                        <div class="slds-form-element__control">
                                            <label class="slds-checkbox_toggle slds-grid">
                                                <input type="checkbox" class="configInput" data-id="showCallToActionButton" name="showCallToActionButton" checked={showCallToActionButton} aria-describedby="showCallToActionButton" onchange={handleCheckboxChange}/>
                                                <span id="showCallToActionButton" class="slds-checkbox_faux_container">
                                                <span class="slds-checkbox_faux"></span>
                                                <span class="slds-checkbox_on">Enabled</span>
                                                <span class="slds-checkbox_off">Disabled</span>
                                                </span>
                                            </label>
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal">
                                        <label class="slds-form-element__label configLabel">Search Result Fields</label>
                                        <div class="slds-form-element__control">
                                            <lightning-dual-listbox class="configInput" data-type="listBox" data-key="searchResultsFields" source-label="Available Fields" selected-label="Selected Fields" options={fieldOptions} value={selectedFieldOptions} onchange={handleDualListboxChange}></lightning-dual-listbox>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <footer class="slds-card__footer"></footer>
                        </article>
                    </lightning-accordion-section>
                    <lightning-accordion-section class="accordianHeader" name="cardContentMappingsConfig" label="Card Content Mapping Configs">
                        <article class="slds-card">
                            <div class="slds-card__header slds-grid">
                                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                    <div class="slds-media__body">
                                    <h2 class="slds-card__header-title slds-truncate subHeader">
                                        <span>Card Content Mappings</span>
                                    </h2>
                                    </div>
                                    <div class="slds-no-flex">
                                        <button class="slds-button configAddNewButton" onclick={showModalBox}>+ Add New</button>
                                    </div>
                                </header>
                            </div>
                            <div class="slds-card__body slds-card__body_inner">
                                <fieldset class="slds-form-element slds-form-element_compound slds-p-bottom_large">
                                    <table class="slds-table slds-table_cell-buffer slds-no-row-hover slds-table_bordered">
                                        <thead class="configTableHeader">
                                            <tr class="slds-line-height_reset">
                                                <th class="" scope="col">
                                                <div class="slds-truncate" title="Show Label">Show Label</div>
                                                </th>
                                                <th class="" scope="col">
                                                <div class="slds-truncate" title="Name">Name</div>
                                                </th>
                                                <th class="" scope="col">
                                                <div class="slds-truncate" title="Label">Label</div>
                                                </th>
                                                <th class="" scope="col">
                                                <div class="slds-truncate" title="Actions">Actions</div>
                                                </th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={rowsOfArrayObjects} for:item="row" for:index="index">
                                                
                                                <tr key={row.key} class="configTableBodyRow">
                                                    
                                                    <template for:each={row} for:item="field">
                                                        
                                                        <template if:true={field.isCheckbox}>
                                                            <td key={field.name}>
                                                                <lightning-input type="checkbox" data-index={index} data-key={field.name} data-parent={field.parent} data-type={field.type} data-original={field.originalType} id={field.name} checked={field.value} onchange={handleContentMappingChange}></lightning-input>
                                                            </td>
                                                        </template>
                                                        <template if:false={field.isCheckbox}>
                                                            <td key={field.name}>
                                                                <lightning-input type={field.type} class="configTableInput" data-index={index} data-key={field.name} data-parent={field.parent} data-type={field.type} data-original={field.originalType} id={field.name} value={field.value} onchange={handleContentMappingChange} disabled={field.isReadOnly}></lightning-input>
                                                            </td>
                                                        </template>
                                                    
                                                    </template>
    
                                                    <td>
                                                        <lightning-icon icon-name="utility:delete" size="small" label="Delete" onclick={handleDelete} data-index={index} class="deleteIcon" title="Delete Mapping" variant="base"></lightning-icon>
                                                    </td>
    
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </fieldset>
                            </div>
                        </article>
                    </lightning-accordion-section>
                </lightning-accordion>
            </div>
            
            <template if:true={isShowModal}>
                <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
                    aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container">
                        <!-- modal header start -->
                        <header class="slds-modal__header">
                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                title="Close" onclick={hideModalBox}>
                                <lightning-icon class="myIcon" icon-name="utility:close" alternative-text="close"
                                    size="small"></lightning-icon>
                                <span class="slds-assistive-text">Close</span>
                            </button>
                            <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">New Card Content Mapping</h2>
                        </header>
        
                        <!-- modal body start -->
                        <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                            <div class="slds-form-element slds-form-element_compound">
                                <div class="slds-form-element slds-form-element_stacked">
                                    <lightning-combobox name="inputName" label="Name" data-id="inputName" options={fieldOptionsForNewMapping} value={inputName} onchange={handleInputChange} required></lightning-combobox>
                                </div>
                                <div class="slds-form-element slds-form-element_stacked">
                                    <lightning-input type="text" data-id="inputLabel" value={inputLabel} label="Label" onchange={handleInputChange} required></lightning-input>
                                </div>
                                <div class="slds-form-element slds-form-element_stacked">
                                    <lightning-input type="checkbox" data-id="inputShowLabel" value={inputShowLabel} label="Show Label" onchange={handleInputChange}></lightning-input>
                                </div>
                            </div>
                        </div>
        
                        <!-- modal footer start-->
                        <footer class="slds-modal__footer">
                            <button class="slds-button slds-button_neutral" onclick={hideModalBox}>Cancel</button>
                            <button class="slds-button slds-button_brand" onclick={addNewRow}>Save</button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>
            <div class="button-container slds-m-top_medium slds-p-horizontal_medium slds-text-align_center">
                <lightning-button label="Save" variant="brand" class="slds-p-horizontal_small" onclick={handleSave}></lightning-button>
                <lightning-button label="Cancel" variant="neutral" onclick={handleCancel}></lightning-button>
            </div>
        </article>
    </template> 
</template>
