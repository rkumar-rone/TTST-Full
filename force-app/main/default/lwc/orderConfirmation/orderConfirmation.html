<template>
  <template lwc:if={invoiceMessage}>
    <h2 class="slds-text-heading_medium">{invoiceLabel}</h2>
  </template>
  <template lwc:if={billingAddress}>
    <h2 class="slds-p-around_x-small slds-text-title_caps slds-m-top_small">Billing Address</h2>
    <div class="address-container">
      <lightning-formatted-address
        street={billingStreet}
        city={billingCity}
        country={billingCountry}
        province={billingState}
        postal-code={billingPostalCode}
        disabled
      ></lightning-formatted-address>
    </div>
  </template>
</template>
