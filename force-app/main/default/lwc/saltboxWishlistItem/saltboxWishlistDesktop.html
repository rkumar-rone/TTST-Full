<!-- Desktop HTML template-->
<template>
    <div class="slds-grid inactive-bucket-item" data-id="bucket-item" onclick={handleWishListItems}>
        <div class="slds-col slds-align-content-center slds-p-horizontal--small">
            <template if:false={editBucketName}>
                <span class="bucket-name">{item.name}</span>
            </template>
            <template if:true={editBucketName}>
                <input type="text" onchange={handleBucketNameChange} value={bucketInputValue} id="text-input-id-47" data-id="bucket-input" placeholder="Placeholder text…" required="" class="slds-input bucket-input" />
            </template>
        </div>
        <div class="slds-col slds-align-content-center slds-p-horizontal--small">

            <svg if:false={editBucketName} width="14" onclick={handleEditBucketName} class="slds-float--right" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12.6322 2.66783C12.7893 2.82494 12.7893 3.02506 12.6322 3.18217L3.06434 12.75H0.75V10.4357L10.3178 0.867831C10.4749 0.710723 10.6751 0.710724 10.8322 0.86783L12.6322 2.66783L13.1413 2.15871L12.6322 2.66783Z" stroke="#2A8F56" stroke-width="1.5" stroke-linejoin="round"></path>
             </svg>
             <div class="slds-grid" if:true={editBucketName}>
                <div class="slds-col slds-p-horizontal--small">
                  <lightning-icon onclick={updateWishlistName} size="x-small" icon-name="utility:check" ></lightning-icon>
                </div>
                <div class="slds-col">
                    <lightning-icon onclick={handleEditBucketName}   size="x-small" icon-name="utility:close" ></lightning-icon>
                    <!--<svg focusable="false" onclick={handleEditBucketName} stroke="#2A8F56" if:true={editBucketName} data-key="close" aria-hidden="true" viewBox="0 0 52 52" class="slds-icon slds-icon_small"><g><path d="M31 25.4l13-13.1c.6-.6.6-1.5 0-2.1l-2-2.1c-.6-.6-1.5-.6-2.1 0L26.8 21.2c-.4.4-1 .4-1.4 0L12.3 8c-.6-.6-1.5-.6-2.1 0l-2.1 2.1c-.6.6-.6 1.5 0 2.1l13.1 13.1c.4.4.4 1 0 1.4L8 39.9c-.6.6-.6 1.5 0 2.1l2.1 2.1c.6.6 1.5.6 2.1 0L25.3 31c.4-.4 1-.4 1.4 0l13.1 13.1c.6.6 1.5.6 2.1 0L44 42c.6-.6.6-1.5 0-2.1L31 26.8c-.4-.4-.4-1 0-1.4z"></path></g></svg>-->
                </div>
             </div>
            
        </div>
   </div>
</template>
