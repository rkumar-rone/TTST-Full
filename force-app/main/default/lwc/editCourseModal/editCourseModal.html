<template>
    <template if:true={showModal}>
        <div class="slds-modal slds-fade-in-open" style="position: fixed; top: -90px; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 9999;">
            <div style="width: 100%; height: 100%;">
                <!-- Modal header with close button -->
                <div class="slds-modal__header" style="color: #31859c; height:50px; font">
                    Sessions
                    <button class="slds-button slds-modal__close slds-button_icon-inverse" style="top:10px; left:280px;" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" size="small" class="icon-right"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <!-- Other header content here -->
                </div>
                <!-- Modal content here -->
                <div class="slds-modal__content">
                    <!-- Content here -->
                <!-- <template if:false={isParentProduct}> -->
                    <div class="sessions" style={displayDiv}>
                        <template if:true={eventSessions}>
                            <div class="checkboxSection">
                                <template for:each={eventSessions} for:item="eventSession">
                                <div key={eventSession.Id} class="checkboxWrapper">
                                    <lightning-input 
                                        name={eventSession.Name} 
                                        type="checkbox" 
                                        label={eventSession.label} 
                                        data-key={eventSession.Id}
                                        data-required={eventSession.Required__c}
                                        checked={eventSession.isChecked}
                                        key={eventSession.Id} 
                                        data-id={eventSession.Id}
                                        onchange={handleSessionChange}>
                                    </lightning-input>
                            </div>

                                </template>
                            </div>
                        </template>
                    </div>
                    <lightning-button variant="brand" label="Save" title="Save" onclick={handleSave} class="slds-m-around--xxx-small slds-m-left_x-small btn"></lightning-button>
                </div>
            </div>
        </div>
        <div class="slds-backdrop slds-backdrop_open" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%;"></div>
    </template>
</template>
