<template>
    <template lwc:if={isLoading}>
        <div class="stencil-container">
            <div class="header-stencil">
                <div class="name-stencil">
                    <c-stencil height="30" width="100%" class="stencil"></c-stencil>
                </div>
                <div class="name-stencil">
                    <c-stencil height="30" width="100%" class="stencil"></c-stencil>
                </div>
                <div class="name-stencil">
                    <c-stencil height="30" width="100%" class="stencil"></c-stencil>
                </div>
                <div class="name-stencil">
                    <c-stencil height="30" width="100%" class="stencil"></c-stencil>
                </div>
                <div class="name-stencil">
                    <c-stencil height="30" width="100%" class="stencil"></c-stencil>
                </div>
            </div>
            <div class="footer-stencil">
                <div class="pagi-stencil">
                    <c-stencil height="30" width="100%" class="stencil"></c-stencil>
                </div>
            </div>
        </div>
    </template>
    <template lwc:else>
        <template lwc:if={state.showRelatedList}>
            <lightning-layout class="slds-m-top_x-small">
                <article class="slds-card lightning-card">
                    <div class="slds-card__header slds-grid slds-theme_shade" data-id="header">
                        <header class="slds-media slds-media_center slds-has-flexi-truncate ">
                            <div class="slds-media__figure">
                                <lightning-icon icon-name={state.iconName} size="small"></lightning-icon>
                            </div>
                            <div class="slds-media__body">
                                <h2 class="slds-card__header-title">
                                    <p>{state.title}</p>
                                </h2>
                            </div>
                            <template lwc:if={hideActions}></template>
                            <template lwc:else>
                                <div class="slds-no-flex">
                                    <lightning-button label="New" onclick={handleCreateRecord}></lightning-button>
                                </div>
                            </template>
                        </header>
                        <template lwc:if={searchAvailable}>
                            <lightning-layout vertical-align="end">
                                <lightning-layout-item class="slds-text-align_center slds-align_absolute-center slds-float_right" size="8">
                                    <lightning-input type="search" onchange={handleKeyChange} class="slds-m-bottom_small slds-m-top_large slds-p-bottom_xxx-small" variant="label-hidden" placeholder="Search"
                                    value={searchKey}>
                                </lightning-input>
                                </lightning-layout-item>
                                <lightning-layout-item class="slds-text-align_center slds-align_absolute-center slds-float_right slds-p-top_x-small" size="1">
                                    <lightning-button label={labels.search} onclick={handleSearchKeyword} variant="brand"></lightning-button>  
                                </lightning-layout-item>
                            </lightning-layout>
                        </template>
                    </div>
                    <template lwc:if={hasRecords}>
                        <div>
                            <template lwc:if={validAccess}>
                                <c-sib-lightning-datatable-pagination hide-checkbox-column="true" resize-column-disabled="true"
                                    class="related-list" key-field='id' source-data={state.records} columns={state.columns}
                                    display-ammount={amount} sobject-api-name={sobjectApiName} state={state}
                                    onrefreshdata={handleRefreshData} brand-color={brandColor} text-color={textColor}>
                                </c-sib-lightning-datatable-pagination>
                            </template>
                            <template lwc:else>
                                <div class="slds-align_absolute-center slds-m-vertical_x-small">
                                   {labels.accessErrorMsg}
                                </div>
                            </template>
                        </div>
                        <footer class="slds-card__footer slds-m-bottom_xx-small">
                        </footer>
                    </template>
                </article>
            </lightning-layout>
        </template>
    </template>

</template>
