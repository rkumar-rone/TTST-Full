<template>
    <template if:true={config}>
        <article class="slds-card slds-p-around_medium noShadow">
            <div class="slds-card__body slds-card__body_inner"><!--slds-card__body_scrollable-->
                <lightning-accordion allow-multiple-sections-open
                         active-section-name={activeSections}>
                    <lightning-accordion-section name="individualConfigs" class="accordianHeader" label="Individual Configs">
                        <article class="slds-card">
                            <div class="slds-card__body slds-card__body_inner">
                                <div class="slds-form slds-form_compound slds-p-top_large slds-p-bottom_large" >
                                    <!--<div class="slds-form-element slds-form-element_horizontal">
                                        <label class="slds-form-element__label configLabel">Page Type</label>
                                        <div class="slds-form-element__control">
                                            <lightning-input type="text" class="configInput" data-id="pageType" value={pageType} onchange={handleChange}></lightning-input>
                                        </div>
                                    </div>-->
                                    <div class="slds-form-element slds-form-element_horizontal">
                                        <label class="slds-form-element__label configLabel">Object API Name</label>
                                        <div class="slds-form-element__control configInputPaddingLeft configInputWidth">
                                            <lightning-combobox name='objectApiName' class="configInput" data-id='objectApiName' options={objectAPINameOptions} value={objectApiName} onchange={handleObjectAPINameConfigChange}></lightning-combobox>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </article>
                    </lightning-accordion-section>
                </lightning-accordion>
            </div>
        </article>
        <div class="button-container slds-m-top_medium slds-p-horizontal_medium slds-text-align_center">
            <lightning-button label="Save" variant="brand" class="slds-p-horizontal_small" onclick={handleSave}></lightning-button>
            <lightning-button label="Cancel" variant="neutral" onclick={handleCancel}></lightning-button>
        </div>
    </template> 
</template>
