<template lwc:render-mode="light">
    <!-- Filters Panel - shows the Filter tree and facets for a search result -->
    <div lwc:if={isDesktop}>
        <c-sib-public-course-calendar-filters-panel
            selected-filters = {selectedFilters}
            filters = {filters}
            is-clear-all = {isClearAll}
            onfacetvalueupdate={handleInputChange}
        >
        </c-sib-public-course-calendar-filters-panel>
        <div class="filter-btn">
            <button
                type="button"
                class="filter-btn active"
                id="filter-btn" 
                onclick={handleClearAllFilters}
            >
                <span class="clear">{clearAllLabel}</span>
            </button>
        </div>
    </div>
    <div lwc:else>
        <button
            class="slds-button slds-button_neutral slds-button_stretch"
            title={filterHeaderLabel}
            onclick={handleOpenSearchFiltersModal}>
            {filterHeaderLabel}
        </button>
    </div>
</template>
